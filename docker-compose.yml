services:
  ids-agent:
    build:
      context: ./ids-agent
      dockerfile: Dockerfile
    image: ids-agent:latest
    container_name: ids-agent
    restart: unless-stopped
    ports:
      - "8766:8766"
    environment:
      - IDS_API_URL=${IDS_API_URL:-http://10.10.6.238:8765}
      - SF_API_URL=${SF_API_URL:-http://10.10.6.238:9090}
      - AGENT_ADDR=:8766
    networks:
      - ztnet
    labels:
      # Autoheal opts-in: restart container automatically when healthcheck fails.
      autoheal: "true"
    healthcheck:
      # Probes BOTH the Go process (localhost) AND external network reach to
      # Suricata (10.10.6.238:8765). The latter catches the "container alive
      # but eth0 missing" failure mode observed 2026-05-09 — loopback wouldn't
      # have caught it, but `nc -z` against an external IP does.
      test: ["CMD-SHELL", "wget -q --spider --timeout=3 http://localhost:8766/health && nc -z -w 2 10.10.6.238 8765"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    image: fe:latest
    container_name: fe
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - AGENT_URL=http://ids-agent:8766
      - INTEL_URL=http://intelligence-layer:8767
      - NODE_ENV=production
    depends_on:
      - ids-agent
      - intelligence-layer
    networks:
      - ztnet
    labels:
      autoheal: "true"
    healthcheck:
      # Hits Next.js on /monitor (a real page that must render) AND verifies
      # bridge-network reach to ids-agent. Catches both Node "zombie alive"
      # (process up but ResponseAborted) and broken Docker bridge.
      test: ["CMD-SHELL", "node -e 'Promise.all([fetch(\"http://localhost:3000/monitor\"),fetch(\"http://ids-agent:8766/health\")]).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  intelligence-layer:
    build:
      context: ./intelligence-layer
      dockerfile: Dockerfile
    image: intelligence-layer:latest
    container_name: intelligence-layer
    restart: unless-stopped
    ports:
      - "8767:8767"
    env_file:
      - ./intelligence-layer/.env
    environment:
      - IDS_AGENT_URL=http://ids-agent:8766
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql+asyncpg://ztuser:ztpass@postgres:5432/zerotrust
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=pk-lf-zt-public-2026
      - LANGFUSE_SECRET_KEY=sk-lf-zt-secret-2026
      - LANGFUSE_ENABLED=true
    depends_on:
      - ids-agent
      - redis
      - postgres
      - langfuse
    networks:
      - ztnet
    labels:
      autoheal: "true"
    healthcheck:
      # FastAPI /health checks own liveness; second probe verifies bridge-net
      # reach to redis (port 6379). Catches both Python crash and Docker
      # network namespace issues.
      test: ["CMD-SHELL", "python -c 'import urllib.request,socket; urllib.request.urlopen(\"http://localhost:8767/health\",timeout=3); s=socket.create_connection((\"redis\",6379),timeout=3); s.close()'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: zt-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"                     # exposed to LAN — RedisInsight / redis-cli from laptop
    networks:
      - ztnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: zt-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ztuser
      - POSTGRES_PASSWORD=ztpass
      - POSTGRES_DB=zerotrust
    ports:
      - "5432:5432"                     # exposed to LAN — DBeaver / psql from laptop
    volumes:
      - zt_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ztnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztuser -d zerotrust"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Langfuse v2 — LLM observability (lightweight all-in-one)
  langfuse:
    image: langfuse/langfuse:2
    container_name: zt-langfuse
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://ztuser:ztpass@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: a256413ce45eb5c398fa89710b952fe48355b2293e88b77daddad49a7c3ed6ea
      SALT: ca691e9f2430a3c25d27ce26293d1006cb478c4da665d2e686140a542d474f63
      ENCRYPTION_KEY: 527aa29606fafc5ddd1b1564e9a788c48b5deab5eb7a7b1dde53395257ac3bae
      TELEMETRY_ENABLED: "false"
      LANGFUSE_DEFAULT_PROJECT_ROLE: ADMIN
      # Bootstrap: auto-create org/project/user/keys at startup (idempotent)
      LANGFUSE_INIT_ORG_ID: zt-org
      LANGFUSE_INIT_ORG_NAME: Zero Trust
      LANGFUSE_INIT_PROJECT_ID: zt-agent
      LANGFUSE_INIT_PROJECT_NAME: Intelligence Layer
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-zt-public-2026
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-zt-secret-2026
      LANGFUSE_INIT_USER_EMAIL: admin@zt.local
      LANGFUSE_INIT_USER_NAME: ZT Admin
      LANGFUSE_INIT_USER_PASSWORD: AkJ8uAipXssHBJaTQXJ4VjT3
    depends_on:
      - postgres
    networks:
      - ztnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Autoheal — watches Docker events for `unhealthy` status and restarts the
  # affected container. Opt-in via label `autoheal=true`. Replaces the manual
  # `docker restart <svc>` workflow when ids-agent/fe/intel-layer hangs or
  # loses network namespace. Tiny image (~5 MB), reads docker.sock read-only.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: zt-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal       # only restart containers with this label
      - AUTOHEAL_INTERVAL=10                     # check every 10s
      - AUTOHEAL_START_PERIOD=60                 # grace 60s after container start
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10         # SIGTERM grace before SIGKILL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"


networks:
  ztnet:
    driver: bridge

volumes:
  zt_pgdata:
