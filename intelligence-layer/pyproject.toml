[project]
name = "intelligence-layer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API & async
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",

    # Data stores
    "redis[hiredis]>=5.2.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",

    # Validation & schemas
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # SSH backend (fallback)
    "asyncssh>=2.18.0",

    # Observability
    "structlog>=24.4.0",
    "langfuse>=2.50.0,<3",

    # Utilities
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.4.0",
    "pyvis>=0.3.2",
    "jinja2>=3.1.0",

    # Vector embeddings — pgvector multi-strategy retrieval over past decisions
    "pgvector>=0.3.6",
    "fastembed>=0.4.0",

    # Knowledge Graph store — Neo4j replaces NetworkX in-memory KG (production grade,
    # persistent, Cypher traversal, GraphRAG-ready)
    "neo4j>=5.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
