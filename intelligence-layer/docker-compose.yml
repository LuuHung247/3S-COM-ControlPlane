services:
  redis:
    image: redis:7-alpine
    container_name: zt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    container_name: zt-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ztuser
      POSTGRES_PASSWORD: ztpass
      POSTGRES_DB: zerotrust
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    container_name: zt-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  intelligence-layer:
    build: .
    container_name: zt-intelligence
    restart: unless-stopped
    ports:
      - "8767:8767"
    env_file: .env
    depends_on:
      - redis
      - postgres
      - chroma
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  postgres_data:
  chroma_data:
